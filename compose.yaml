services:
  postgres:
    image: postgres:17-alpine
    container_name: taskforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - taskforge-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taskforge-data: