spring:
  application:
    name: taskforge

  datasource:
    url: jdbc:postgresql://localhost:5433/taskforge
    username: taskforge
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  flyway:
    enabled: true